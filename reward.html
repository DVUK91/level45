<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LEVEL 45 - Reward</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap reward-wrap">
    <section class="reward-panel fade-in">
      <div class="reward-confetti" aria-hidden="true"></div>
      <p class="kicker">FINAL BRIEFING UNLOCKED</p>
      <h1 class="reward-title">Dinner Out</h1>
      <p class="reward-birthday">Happy Birthday!</p>

      <div class="progress success reward-progress" aria-label="complete progress">
        <div class="bar" style="width:100%"></div>
      </div>

      <div class="terminal reward-copy">
STATUS: 100% COMPLETE
MISSION: Birthday Dinner
DATE: 13.04.2026
TIME: 7.30pm
LOCATION: <a class="reward-link" href="https://maps.app.goo.gl/56pwhYzN61pPP9QW8" target="_blank" rel="noopener">Abeno</a>

OBJECTIVE:
Proceed to Abeno. Engage okonomiyaki protocol.

REWARD:
Dinner secured. No troubleshooting required.
      </div>

      <div class="btnrow centered">
        <button class="btn btn-success" id="playTheme" type="button">START FINAL MUSIC</button>
        <a class="btn btn-primary" href="missions.html">REPLAY MISSIONS</a>
        <button class="btn" id="resetAll" type="button">RESET PROGRESS</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.requireUnlocked("reward");
    Level45.initShell("missions");
    Level45.sfxWin();

    const playTheme = document.getElementById("playTheme");
    function syncThemeButton(){
      playTheme.textContent = Level45.isRewardThemePlaying() ? "STOP FINAL MUSIC" : "START FINAL MUSIC";
    }

    playTheme.addEventListener("click", ()=>{
      if(!Level45.getSettings().soundOn){
        Level45.toast("Switch SFX ON, then tap again");
        return;
      }
      if(Level45.isRewardThemePlaying()){
        Level45.stopRewardTheme();
        syncThemeButton();
      }else if(Level45.startRewardTheme()){
        playTheme.textContent = "STOP FINAL MUSIC";
      }else{
        Level45.toast("Tap again to unlock sound");
      }
    });
    window.addEventListener("pagehide", Level45.stopRewardTheme);

    document.getElementById("resetAll").addEventListener("click", ()=>{
      if(confirm("Reset all progress and return to missions?")){
        Level45.resetProgress();
        window.location.href = "missions.html";
      }
    });
  </script>
</body>
</html>
