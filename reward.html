<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LEVEL 45 - Reward</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap reward-wrap">
    <section class="reward-panel fade-in">
      <p class="kicker">FINAL BRIEFING UNLOCKED</p>
      <h1 class="reward-title">Dinner Out</h1>
      <p class="subhead">Mission complete. The reward is a proper evening out, no troubleshooting required.</p>

      <div class="progress success reward-progress" aria-label="complete progress">
        <div class="bar" style="width:100%"></div>
      </div>

      <div class="terminal reward-copy">
STATUS: 100% COMPLETE
PLAYER: LUKI13
OBJECTIVE: Eat well. Laugh loudly. Leave the dishes elsewhere.
BONUS ROUND: Dessert remains highly recommended.
      </div>

      <div class="btnrow centered">
        <a class="btn btn-primary" href="missions.html">REPLAY TRIALS</a>
        <button class="btn" id="resetAll" type="button">RESET PROGRESS</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.requireUnlocked("reward");
    Level45.initShell("missions");
    Level45.sfxWin();

    document.getElementById("resetAll").addEventListener("click", ()=>{
      if(confirm("Reset all progress and return to missions?")){
        Level45.resetProgress();
        window.location.href = "missions.html";
      }
    });
  </script>
</body>
</html>
