<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LEVEL 45 - Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap">
    <section class="page-head fade-in">
      <p class="kicker">PLAYER PROFILE LOADED</p>
      <h1 class="h1">LUKI13</h1>
      <p class="subhead">Built in the 80s. Running flawlessly.</p>
    </section>

    <section class="grid grid-2 section">
      <div class="avatar-stage">
        <div class="avatar-ring">
          <img src="avatar-portrait.png" alt="Luki13 avatar" class="avatar" />
        </div>
        <div class="scanline"></div>
        <p class="avatar-mode mono">MODE: STEADY</p>
      </div>

      <div class="panel panel-pad">
        <div class="card-head">
          <p class="kicker">PLAYER STATS</p>
          <p class="mono stat-xp"><span data-xp>0</span> XP</p>
        </div>

        <div class="stat-list">
          <div class="stat-row" data-value="96">
            <span>Pattern Recognition</span>
            <strong>96%</strong>
            <div class="stat-track"><div class="stat-fill"></div></div>
          </div>
          <div class="stat-row" data-value="88">
            <span>Decision Speed</span>
            <strong>88%</strong>
            <div class="stat-track"><div class="stat-fill"></div></div>
          </div>
          <div class="stat-row" data-value="92">
            <span>Cultural Memory</span>
            <strong>92%</strong>
            <div class="stat-track"><div class="stat-fill"></div></div>
          </div>
          <div class="stat-row" data-value="99">
            <span>Signal Stability</span>
            <strong>99%</strong>
            <div class="stat-track"><div class="stat-fill"></div></div>
          </div>
          <div class="stat-row" data-value="90">
            <span>Meme Processing Unit</span>
            <strong>90%</strong>
            <div class="stat-track"><div class="stat-fill"></div></div>
          </div>
        </div>

        <div class="hr"></div>
        <a class="btn btn-primary btn-wide arcade-start" href="missions.html">START MISSIONS</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.initShell("profile");
    requestAnimationFrame(()=>{
      document.querySelectorAll(".stat-row").forEach((row)=>{
        row.querySelector(".stat-fill").style.width = row.dataset.value + "%";
      });
    });
  </script>
</body>
</html>
