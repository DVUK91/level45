<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEVEL 45 - System Response</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap game-wrap">
    <section class="game-head">
      <p class="kicker">TRIAL 3</p>
      <h1 class="h1">System Response</h1>
      <p class="subhead">Enter the binary override before the timer expires.</p>
    </section>

    <section class="game-surface">
      <div class="round-meta mono" id="roundMeta">ROUND 1/3</div>
      <div class="trial-module response-module">
        <div class="code-display mono" id="codeDisplay">----</div>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <p class="input-readout mono" id="inputReadout">INPUT: ----</p>
      </div>
      <p class="game-message" id="message">Match the code using 0 and 1.</p>
      <div class="binary-controls">
        <button class="btn binary-btn" type="button" data-bit="0">0</button>
        <button class="btn binary-btn" type="button" data-bit="1">1</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.requireUnlocked("response");
    Level45.initShell("missions");

    const codes = ["1010", "0111", "1101"];
    let round = 0;
    let input = "";
    let timer;
    let startedAt;
    let accepting = true;
    const limit = 5200;
    const codeDisplay = document.getElementById("codeDisplay");
    const readout = document.getElementById("inputReadout");
    const fill = document.getElementById("timerFill");
    const message = document.getElementById("message");
    const meta = document.getElementById("roundMeta");

    function startRound(){
      accepting = true;
      input = "";
      codeDisplay.textContent = codes[round];
      meta.textContent = `ROUND ${round + 1}/3`;
      message.textContent = "Awaiting input.";
      updateReadout();
      startedAt = performance.now();
      cancelAnimationFrame(timer);
      tick();
    }

    function tick(){
      const elapsed = performance.now() - startedAt;
      const remaining = Math.max(0, 1 - elapsed / limit);
      fill.style.width = `${remaining * 100}%`;
      if(remaining <= 0){
        failRound("Timeout. Round reset.");
        return;
      }
      timer = requestAnimationFrame(tick);
    }

    function updateReadout(){
      readout.textContent = `INPUT: ${(input + "----").slice(0, 4)}`;
    }

    function failRound(text){
      accepting = false;
      cancelAnimationFrame(timer);
      Level45.sfxBad();
      message.textContent = text;
      setTimeout(startRound, 650);
    }

    function pushBit(bit){
      if(!accepting) return;
      input += bit;
      updateReadout();
      Level45.sfxOk();
      if(!codes[round].startsWith(input)){
        failRound("Wrong input. Round reset.");
        return;
      }
      if(input.length === 4){
        accepting = false;
        cancelAnimationFrame(timer);
        round++;
        if(round >= codes.length){
          Level45.completeTrial("response");
          Level45.showCompleteOverlay("reward.html");
          return;
        }
        message.textContent = "Override accepted.";
        setTimeout(startRound, 650);
      }
    }

    document.querySelectorAll("[data-bit]").forEach((button)=>{
      button.addEventListener("click", ()=>pushBit(button.dataset.bit));
    });

    startRound();
  </script>
</body>
</html>
