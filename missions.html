<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LEVEL 45 - Missions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap">
    <section class="page-head fade-in">
      <p class="kicker">MISSION HUB</p>
      <h1 class="h1">LEVEL 45</h1>
      <p class="subhead">Complete all three to unlock birthday reward.</p>
    </section>

    <section class="mission-grid section" id="missionGrid"></section>

    <section class="section panel panel-pad">
      <div class="card-head">
        <p class="kicker">RUN STATUS</p>
        <p class="mono"><span data-complete-count>0</span>/3 COMPLETE</p>
      </div>
      <div class="progress">
        <div class="bar" data-progress-bar></div>
      </div>
      <div class="btnrow">
        <button class="btn btn-danger" id="resetRun" type="button">RESET RUN</button>
        <a class="btn btn-success" id="rewardLink" href="reward.html">FINAL REWARD</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.initShell("missions");

    const missions = [
      {
        key: "pattern",
        title: "1. Pattern Scan",
        body: "Read the grid. Lock the signal. No panic clicks.",
        href: "pattern.html",
        unlocked: true
      },
      {
        key: "rhythm",
        title: "2. Rhythm Alignment",
        body: "Catch the timing window and hold the beat steady.",
        href: "rhythm.html",
        unlocked: Level45.getProgress().pattern
      },
      {
        key: "response",
        title: "3. System Response",
        body: "Enter override code before the timer drops.",
        href: "response.html",
        unlocked: Level45.getProgress().rhythm
      }
    ];

    function renderMissions(){
      const progress = Level45.getProgress();
      const grid = document.getElementById("missionGrid");
      grid.innerHTML = "";

      missions.forEach((mission)=>{
        const done = progress[mission.key];
        const unlocked = mission.unlocked || done;
        const state = done ? "DONE" : unlocked ? "NEXT" : "LOCKED";
        const el = document.createElement(unlocked ? "a" : "article");
        el.className = `mission-card ${done ? "is-done" : ""} ${!unlocked ? "is-locked" : ""}`;
        if(unlocked) el.href = mission.href;
        el.innerHTML = `
          <span class="mission-state mono">${state}</span>
          <h2>${mission.title}</h2>
          <p>${mission.body}</p>
        `;
        grid.appendChild(el);
      });

      document.getElementById("rewardLink").classList.toggle("disabled", !progress.response);
    }

    document.getElementById("resetRun").addEventListener("click", ()=>{
      if(confirm("Reset all trial progress?")){
        Level45.resetProgress();
        Level45.sfxBad();
        window.location.reload();
      }
    });

    document.getElementById("rewardLink").addEventListener("click", (event)=>{
      if(!Level45.getProgress().response){
        event.preventDefault();
        Level45.toast("Final reward locked.");
        Level45.sfxBad();
      }
    });

    renderMissions();
  </script>
</body>
</html>
