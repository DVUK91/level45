<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LEVEL 45 - Rhythm Alignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap game-wrap">
    <section class="game-head">
      <p class="kicker">MISSION 2</p>
      <h1 class="h1">Rhythm Alignment</h1>
      <p class="subhead">Lock the pulse while it crosses the center target.</p>
    </section>

    <section class="game-surface">
      <div class="round-meta mono" id="roundMeta">ROUND 1/3</div>
      <div class="rhythm-track trial-module" id="track">
        <div class="target-zone"></div>
        <div class="pulse" id="pulse"></div>
      </div>
      <p class="game-message" id="message">Hit LOCK inside the target zone.</p>
      <div class="btnrow centered">
        <button class="btn btn-primary arcade-start" id="lockBeat" type="button">LOCK</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.requireUnlocked("rhythm");
    Level45.initShell("missions");

    const pulse = document.getElementById("pulse");
    const track = document.getElementById("track");
    const message = document.getElementById("message");
    const meta = document.getElementById("roundMeta");
    let round = 0;
    const speeds = ["1.45s", "1.25s", "1.05s"];

    function setRound(){
      meta.textContent = `ROUND ${round + 1}/3`;
      pulse.style.animationDuration = speeds[round];
    }

    document.getElementById("lockBeat").addEventListener("click", ()=>{
      const trackBox = track.getBoundingClientRect();
      const pulseBox = pulse.getBoundingClientRect();
      const pulseCenter = pulseBox.left + pulseBox.width / 2;
      const targetCenter = trackBox.left + trackBox.width / 2;
      const tolerance = Math.max(34, trackBox.width * 0.11);
      const hit = Math.abs(pulseCenter - targetCenter) <= tolerance;

      if(!hit){
        Level45.sfxBad();
        message.textContent = "Off beat. Re-center.";
        track.classList.add("shake");
        setTimeout(()=>track.classList.remove("shake"), 240);
        return;
      }

      Level45.sfxOk();
      round++;
      if(round >= 3){
        Level45.completeTrial("rhythm");
        Level45.showCompleteOverlay("missions.html");
        return;
      }
      message.textContent = "Locked. Next pulse.";
      setRound();
    });

    setRound();
  </script>
</body>
</html>
