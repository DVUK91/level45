<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEVEL 45</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="boot-screen">
    <section class="boot-console fade-in" aria-labelledby="bootTitle">
      <p class="kicker">BOOT SEQUENCE</p>
      <h1 id="bootTitle">LEVEL 45</h1>
      <p class="subhead">Profile cache found. Signal stable. Birthday protocol ready.</p>

      <div class="terminal boot-lines" id="bootLines" aria-live="polite">Press START to load player profile.<span class="cursor"></span></div>

      <div class="btnrow">
        <button class="btn btn-primary arcade-start" id="startBoot" type="button">START</button>
        <a class="btn" href="profile.html">SKIP BOOT</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const lines = [
      "SYSTEM BOOTING...",
      "PLAYER PROFILE: LUKI13",
      "LEVEL: 45",
      "MODE: STEADY",
      "SIGNAL: LOCKED",
      "ROUTE: PROFILE.HTML"
    ];
    const boot = document.getElementById("bootLines");
    const start = document.getElementById("startBoot");

    start.addEventListener("click", async ()=>{
      Level45.sfxOk();
      start.disabled = true;
      boot.textContent = "";
      for(const line of lines){
        boot.textContent += line + "\n";
        await new Promise((resolve)=>setTimeout(resolve, 230));
      }
      setTimeout(()=>{ window.location.href = "profile.html"; }, 450);
    });
  </script>
</body>
</html>
