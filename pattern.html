<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern Scan // Level 45</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="fade-in">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-inner stacked">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <div class="title mono">PATTERN SCAN</div>
          <div class="sub">LUKI13 // LEVEL 45</div>
        </div>
      </div>

      <div class="nav">
        <a href="index.html">Boot</a>
        <a href="profile.html">Profile</a>
        <a href="missions.html" class="active">Trials</a>
      </div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrap">
    <div class="progress">
      <div class="bar" style="width: 40%;"></div>
    </div>
  </div>

  <!-- Main -->
  <div class="wrap">
    <div class="card card-pad section">
      <div class="kicker">TRIAL 01</div>
      <h1 class="h1">Identify the signal.</h1>

      <div class="terminal section" id="trialText">
        Rule: Select all ORANGE signals. No false positives.
      </div>

      <div class="trial-hud section">
        <div class="hud-pill"><span class="mono">TIME</span> <span id="timeLeft">--</span></div>
        <div class="hud-pill"><span class="mono">ROUND</span> <span id="round">1</span>/<span id="roundTotal">3</span></div>
        <div class="hud-pill"><span class="mono">SCORE</span> <span id="score">0</span></div>
      </div>

      <div class="signal-grid section" id="signalGrid"></div>

      <div class="btnrow section">
        <button class="btn btn-primary" id="checkBtn" type="button">CHECK</button>
        <button class="btn" id="resetBtn" type="button">RESET</button>
        <a class="btn btn-ghost" href="missions.html">← Back to Trials</a>
      </div>

      <div class="footer" id="resultText">Status: Awaiting input</div>
    </div>

    <div class="footer">Status: Stable • No patch required</div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // Elements
    const grid = document.getElementById("signalGrid");
    const checkBtn = document.getElementById("checkBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultText = document.getElementById("resultText");
    const trialText = document.getElementById("trialText");

    const timeLeftEl = document.getElementById("timeLeft");
    const roundEl = document.getElementById("round");
    const roundTotalEl = document.getElementById("roundTotal");
    const scoreEl = document.getElementById("score");

    const required = [grid, checkBtn, resetBtn, resultText, trialText, timeLeftEl, roundEl, roundTotalEl, scoreEl];
    if (required.some(x => !x)) {
      console.error("Missing required elements on pattern.html");
      return;
    }

    // Tunables (achievable + mobile friendly)
    const TOTAL_ROUNDS = 3;
    const ROUND_TIME_S = 18;

    roundTotalEl.textContent = String(TOTAL_ROUNDS);

    // State
    let round = 1;
    let score = 0;
    let timeLeft = ROUND_TIME_S;
    let timerId = null;

    let rule = "orange"; // "orange" | "green"
    let signals = [];
    let tileEls = [];
    let builtCount = 0;

    let completed = false;
    let paintQueued = false;

    // Utils
    const randBool = (p) => Math.random() < p;

    function setResult(msg, type) {
      resultText.textContent = msg;
      resultText.style.color = "";
      if (type === "good") resultText.style.color = "var(--green)";
      if (type === "bad") resultText.style.color = "var(--danger)";
    }

    function updateHUD() {
      timeLeftEl.textContent = `${Math.max(0, timeLeft)}s`;
      roundEl.textContent = String(round);
      scoreEl.textContent = String(score);
    }

    function stopTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    function startTimer() {
      stopTimer();
      timeLeft = ROUND_TIME_S;
      updateHUD();

      timerId = setInterval(() => {
        if (completed) return;

        timeLeft -= 1;
        updateHUD();

        if (timeLeft <= 0) {
          stopTimer();
          timeLeft = 0;
          updateHUD();

          // mark missed/wrong and paint
          for (let i = 0; i < signals.length; i++) {
            const s = signals[i];
            s.wrong = (s.kind !== rule && s.selected);
            s.missed = (s.kind === rule && !s.selected);
          }
          paintAll();

          setResult("TIMEOUT: Signal window closed. RESET to retry.", "bad");
        }
      }, 1000);
    }

    function setColsForCount(count) {
      const cols = count >= 26 ? 6 : count >= 18 ? 5 : 4;
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    }

    // Build grid ONCE per round (if tile count changes)
    function buildGrid(count) {
      if (count === builtCount) return;

      grid.innerHTML = "";
      tileEls = [];
      builtCount = count;

      setColsForCount(count);

      for (let i = 0; i < count; i++) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "signal";
        el.setAttribute("data-i", String(i));
        el.innerHTML = `<span class="sig-label mono">${String(i + 1).padStart(2, "0")}</span>`;

      

        tileEls.push(el);
        grid.appendChild(el);
      }
    }

    function paintTile(i) {
      const s = signals[i];
      const el = tileEls[i];
      if (!s || !el) return;

      el.className = "signal " + (s.kind === "orange" ? "signal-orange" : "signal-green");
      if (s.selected) el.classList.add("signal-selected");
      if (s.wrong) el.classList.add("signal-wrong");
      if (s.missed) el.classList.add("signal-missed");
    }

    function paintAll() {
      if (paintQueued) return;
      paintQueued = true;

      requestAnimationFrame(() => {
        paintQueued = false;
        for (let i = 0; i < signals.length; i++) paintTile(i);
      });
    }

    function setupRound() {
      completed = false;
      grid.style.pointerEvents = "";
      checkBtn.disabled = false;
      resetBtn.disabled = false;

      // difficulty scales gently by round (achievable)
      const tileCount = 14 + (round - 1) * 4; // 14,18,22
      rule = randBool(0.7) ? "orange" : "green";

      signals = Array.from({ length: tileCount }, (_, i) => ({
        id: i,
        kind: randBool(0.5) ? "orange" : "green",
        selected: false,
        wrong: false,
        missed: false
      }));

      trialText.textContent = `Rule: Select all ${rule.toUpperCase()} signals. No false positives.`;

      buildGrid(tileCount);
      paintAll();
      startTimer();
      setResult("Status: Awaiting input", null);
      updateHUD();
    }

    function showCompleteOverlay(nextHref) {
      const overlay = document.createElement("div");
      overlay.className = "trial-overlay";
      overlay.innerHTML = `
        <div class="trial-overlay-inner">
          <h2>TRIAL COMPLETE</h2>
          <p>Loading next sequence...</p>
        </div>
      `;
      document.body.appendChild(overlay);

      document.body.classList.add("glitch");

      setTimeout(() => {
        document.body.classList.add("fade-out");
      }, 900);

      setTimeout(() => {
        window.location.href = nextHref;
      }, 1200);
    }

    function completeTrial() {
      completed = true;
      stopTimer();

      grid.style.pointerEvents = "none";
      checkBtn.disabled = true;
      resetBtn.disabled = true;

      showCompleteOverlay("rhythm.html");
    }

    function evaluate() {
      if (completed) return;
      if (timeLeft <= 0) return;

      // clear flags
      for (let i = 0; i < signals.length; i++) {
        signals[i].wrong = false;
        signals[i].missed = false;
      }

      let wrong = false;
      let missed = false;

      for (let i = 0; i < signals.length; i++) {
        const s = signals[i];
        if (s.kind !== rule && s.selected) wrong = true;
        if (s.kind === rule && !s.selected) missed = true;
      }

      // mark & paint
      for (let i = 0; i < signals.length; i++) {
        const s = signals[i];
        if (s.kind !== rule && s.selected) s.wrong = true;
        if (s.kind === rule && !s.selected) s.missed = true;
      }
      paintAll();

      if (!wrong && !missed) {
        stopTimer();

        // scoring feels good + achievable
        const gained = 10 + Math.max(0, timeLeft);
        score += gained;
        updateHUD();
        setResult(`PASS: +${gained} SCORE.`, "good");

        if (round >= TOTAL_ROUNDS) {
          completeTrial();
          return;
        }

        // next round
        checkBtn.disabled = true;
        setTimeout(() => {
          round += 1;
          checkBtn.disabled = false;
          setupRound();
        }, 700);
      } else {
        setResult("FAIL: Signal mismatch. Try again or RESET.", "bad");
      }
    }

    function resetAll() {
      stopTimer();
      completed = false;
      round = 1;
      score = 0;
      updateHUD();
      setupRound();
    }
// One single listener for all tiles (better mobile performance)
grid.addEventListener("click", (e) => {
  if (completed) return;
  if (timeLeft <= 0) return;

  const btn = e.target.closest("button.signal");
  if (!btn) return;

  const i = Number(btn.dataset.i);
  const s = signals[i];
  if (!s) return;

  s.selected = !s.selected;
  paintTile(i);
});

    checkBtn.addEventListener("click", evaluate);
    resetBtn.addEventListener("click", resetAll);

    // Boot
    updateHUD();
    setupRound();
  });
  </script>
<script src="app.js"></script>
</body>
</html>
