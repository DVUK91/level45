<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LEVEL 45 - Pattern Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-topbar></header>

  <main class="wrap game-wrap">
    <section class="game-head">
      <p class="kicker">TRIAL 1</p>
      <h1 class="h1">Pattern Scan</h1>
      <p class="subhead">Memorise the lit cells, then rebuild the signal.</p>
    </section>

    <section class="game-surface">
      <div class="round-meta mono" id="roundMeta">ROUND 1/3</div>
      <div class="trial-module pattern-module">
        <div class="pattern-grid" id="patternGrid" aria-label="pattern input grid"></div>
      </div>
      <p class="game-message" id="message">Press START SCAN.</p>
      <div class="btnrow centered">
        <button class="btn btn-primary" id="startRound" type="button">START SCAN</button>
        <button class="btn" id="clearInput" type="button">CLEAR</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    Level45.initShell("missions");

    const rounds = [
      [0, 4, 8],
      [1, 3, 5, 7],
      [0, 2, 4, 6, 8]
    ];
    let round = 0;
    let selected = new Set();
    let accepting = false;
    const grid = document.getElementById("patternGrid");
    const message = document.getElementById("message");
    const meta = document.getElementById("roundMeta");

    for(let i = 0; i < 9; i++){
      const btn = document.createElement("button");
      btn.className = "grid-cell";
      btn.type = "button";
      btn.setAttribute("aria-label", `cell ${i + 1}`);
      btn.addEventListener("click", ()=>toggleCell(i));
      grid.appendChild(btn);
    }

    function setRoundMeta(){
      meta.textContent = `ROUND ${round + 1}/3`;
    }

    function flashPattern(){
      accepting = false;
      selected.clear();
      grid.querySelectorAll(".grid-cell").forEach((cell)=>cell.classList.remove("selected", "lit"));
      message.textContent = "Scanning...";
      Level45.sfxOk();
      rounds[round].forEach((idx)=>{
        grid.children[idx].classList.add("lit");
      });
      setTimeout(()=>{
        grid.querySelectorAll(".grid-cell").forEach((cell)=>cell.classList.remove("lit"));
        accepting = true;
        message.textContent = "Rebuild the pattern.";
      }, 950);
    }

    function toggleCell(idx){
      if(!accepting) return;
      const cell = grid.children[idx];
      if(selected.has(idx)){
        selected.delete(idx);
        cell.classList.remove("selected");
      }else{
        selected.add(idx);
        cell.classList.add("selected");
      }
      Level45.sfxOk();
      checkAnswer();
    }

    function checkAnswer(){
      const target = rounds[round];
      if(selected.size !== target.length) return;
      const ok = target.every((idx)=>selected.has(idx));
      if(!ok){
        Level45.sfxBad();
        message.textContent = "Signal mismatch. Try again.";
        selected.clear();
        grid.querySelectorAll(".grid-cell").forEach((cell)=>cell.classList.remove("selected"));
        return;
      }
      round++;
      if(round >= rounds.length){
        Level45.completeTrial("pattern");
        Level45.showCompleteOverlay("missions.html");
        return;
      }
      Level45.sfxOk();
      setRoundMeta();
      message.textContent = "Pattern accepted.";
      setTimeout(flashPattern, 700);
    }

    document.getElementById("startRound").addEventListener("click", flashPattern);
    document.getElementById("clearInput").addEventListener("click", ()=>{
      selected.clear();
      grid.querySelectorAll(".grid-cell").forEach((cell)=>cell.classList.remove("selected"));
    });

    setRoundMeta();
  </script>
</body>
</html>
